apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-projeto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-projeto
  template:
    metadata:
      labels:
        app: app-projeto
    spec:
      containers:
      - name: app-projeto
        image: laranja1/app-projeto:479077545f9f0d295526900e4a63a760d57d041c

        ports:
        - containerPort: 80
