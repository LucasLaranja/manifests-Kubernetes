apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-projeto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-projeto
  template:
    metadata:
      labels:
        app: app-projeto
    spec:
      containers:
      - name: app-projeto
        image: laranja1/app-projeto:820d2785bd0d547aff230aafc234eb397fc2d98b

        ports:
        - containerPort: 80
